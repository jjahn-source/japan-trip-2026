name: Refresh Airbnb Stay Prices

on:
  schedule:
    - cron: "0 8 * * *"   # Daily at 8am UTC (4am ET / 1am PT)
  workflow_dispatch:       # Manual trigger from GitHub Actions tab on mobile

permissions:
  contents: write
  issues: write

jobs:
  refresh-stays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Refresh Airbnb live search (scored top 6 per leg)
        run: node scripts/refresh-stays-search.mjs
        timeout-minutes: 10

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stays-live.json
          git diff --cached --quiet || (git commit -m "chore: refresh Airbnb live search [bot]" && git pull --rebase && git push)

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ ${{ github.workflow }} failed $(date -u +%Y-%m-%d)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bot-failure" 2>/dev/null || true
