name: Refresh Airbnb Stay Prices

on:
  schedule:
    - cron: "0 8 * * *"   # Daily at 8am UTC (4am ET / 1am PT)
  workflow_dispatch:       # Manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-stays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Refresh Airbnb stay prices
        run: node scripts/refresh-stays.mjs
        timeout-minutes: 10

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/stays-prices.json
          git diff --cached --quiet || (git commit -m "chore: refresh Airbnb stay prices [bot]" && git push)
