name: Auto-Update Content Feeds

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Reddit feed
        run: node scripts/refresh-reddit.mjs || echo "Reddit refresh failed — keeping stale data"
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}

      - name: Refresh weather forecasts
        run: node scripts/refresh-weather.mjs || echo "Weather refresh failed — keeping stale data"

      - name: Refresh travel intel
        run: node scripts/refresh-travel-intel.mjs || echo "Travel intel refresh failed — keeping stale data"

      - name: Refresh AI crew briefing
        run: node scripts/refresh-briefing.mjs || echo "Briefing refresh failed — keeping stale data"
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}

      - name: Clone last30days-skill
        run: git clone https://github.com/mvanhorn/last30days-skill.git /tmp/last30days-skill

      - name: Refresh itinerary optimizations
        run: node scripts/refresh-itinerary-optimizations.mjs || echo "Itinerary optimization failed — keeping stale data"
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          LAST30DAYS_PATH: /tmp/last30days-skill/scripts/last30days.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/reddit-alerts.json public/weather.json public/travel-intel.json public/crew-briefing.json public/itinerary-optimizations.json
          git diff --cached --quiet || (git commit -m "chore: auto-update content feeds [bot]" && git pull --rebase && git push)

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ ${{ github.workflow }} failed $(date -u +%Y-%m-%d)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bot-failure" 2>/dev/null || true
